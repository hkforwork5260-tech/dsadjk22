spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jobalert:
  saramin:
    # 사람인 거절(2026-06-04)로 휴면. 키 없이도 부팅되도록 prod도 mock 기본.
    mode: ${SARAMIN_MODE:mock}
    api-key: ${SARAMIN_API_KEY:}
  collector:
    enabled: ${COLLECTOR_ENABLED:true}
  push:
    enabled: ${PUSH_ENABLED:true}

logging:
  level:
    root: INFO
    com.jobalert: INFO
