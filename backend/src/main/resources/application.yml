spring:
  application:
    name: jobalert-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jobalert:
  saramin:
    # mock = no real API call. real = use api-key. Phase 1 uses mock.
    mode: ${SARAMIN_MODE:mock}
    api-key: ${SARAMIN_API_KEY:}
    base-url: https://oapi.saramin.co.kr/job-search
    daily-call-limit: 500
  collector:
    # Daily 18:00 KST = 09:00 UTC. cron is in server timezone (UTC).
    cron: "0 0 9 * * *"
    enabled: ${COLLECTOR_ENABLED:false}
  push:
    morning-cron: "0 0 0 * * *"   # 00:00 UTC = 09:00 KST
    evening-cron: "0 0 12 * * *"  # 12:00 UTC = 21:00 KST
    enabled: ${PUSH_ENABLED:false}

logging:
  level:
    root: INFO
    com.jobalert: DEBUG
    org.hibernate.SQL: INFO
