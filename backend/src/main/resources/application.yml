spring:
  application:
    name: jobalert-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jobalert:
  saramin:
    # 사람인 거절(2026-06-04)로 휴면. mock 유지.
    mode: ${SARAMIN_MODE:mock}
    api-key: ${SARAMIN_API_KEY:}
    base-url: https://oapi.saramin.co.kr/job-search
    daily-call-limit: 500
  # 하이브리드 수집 소스 (2026-06-04 전환). 각 소스는 JobSource 빈으로 자동 등록됨.
  sources:
    greenhouse:
      enabled: ${GREENHOUSE_ENABLED:true}   # 공개 API, 키 불필요
      # content=true면 공고 본문(HTML)+부서까지 받아 응답이 수십 배 커짐. 무료 박스에선 OOM이라 false였음.
      # Hobby(8GB) 전환 후 켜기: Railway 변수 GREENHOUSE_CONTENT=true → 빅테크 공고 상세·직군분류 충실.
      content: ${GREENHOUSE_CONTENT:false}
    lever:
      enabled: ${LEVER_ENABLED:true}        # 공개 API, 키 불필요
    public-institution:
      # 기재부 공공기관 채용 API. data.go.kr serviceKey 필요(JOBALERT_PUBINST_KEY).
      enabled: ${PUBINST_ENABLED:false}
      service-key: ${JOBALERT_PUBINST_KEY:}
      max-pages: 5
      page-size: 100
    seoul:
      # 서울시 일자리포털. data.seoul.go.kr serviceKey(JOBALERT_SEOUL_KEY). sample로 테스트 가능.
      enabled: ${SEOUL_ENABLED:false}
      service-key: ${JOBALERT_SEOUL_KEY:sample}
      max-rows: ${SEOUL_MAX_ROWS:1000}
    samsung:
      # 삼성 채용 통합 허브(samsungcareers.com). 인증·키 불필요, robots 없음. HTML 파싱(Jsoup).
      # 삼성전자·전기·SDI·E&A·제일기획·에스원 등 계열사 공고가 한 곳에 섞여 나옴(공채시즌 삼성전자 신입).
      enabled: ${SAMSUNG_ENABLED:true}
      max-pages: ${SAMSUNG_MAX_PAGES:10}
    recruiter:
      # recruiter.co.kr(MIDAS jobflex) 공유 ATS. 인증불필요. tenant 목록=SourceRegistry.recruiterTenants
      # (KT·현대모비스·HL그룹·DB그룹·SPC·NH투자증권 등 ~49개사, prefix 헤더만 교체).
      enabled: ${RECRUITER_ENABLED:true}
      page-size: ${RECRUITER_PAGE_SIZE:100}
      max-pages: ${RECRUITER_MAX_PAGES:20}
    greeting:
      # 그리팅(greetinghr.com) 공개 채용 API. 인증불필요. workspace 목록=SourceRegistry.greetingWorkspaces
      # (무신사·컬리·HYBE·CJ올리브영·현대오토에버·카카오모빌리티 등, workspaceId만 교체).
      enabled: ${GREETING_ENABLED:true}
      page-size: ${GREETING_PAGE_SIZE:100}
      max-pages: ${GREETING_MAX_PAGES:20}
  collector:
    # 무료 박스 OOM 회피: 가벼운 소스와 무거운 공공기관을 다른 시각에 분리 수집.
    # cron zone=UTC. 06·18시 KST에 가벼운 소스, 그 30분 뒤 공공기관 단독(깨끗한 메모리 상태).
    cron-light: "0 0 9,21 * * *"    # 06:00·18:00 KST — greenhouse, seoul (순차)
    cron-heavy: "0 30 9,21 * * *"   # 06:30·18:30 KST — pubinst 단독(제일 무거움)
    enabled: ${COLLECTOR_ENABLED:false}
  push:
    morning-cron: "0 0 0 * * *"   # 00:00 UTC = 09:00 KST
    evening-cron: "0 0 12 * * *"  # 12:00 UTC = 21:00 KST
    enabled: ${PUSH_ENABLED:false}
  fcm:
    # FCM 푸시 발송. 활성화: FCM_ENABLED=true
    # 키 제공: 클라우드는 FCM_CREDENTIALS_JSON(서비스계정 JSON 통째), 로컬은 FCM_CREDENTIALS_PATH(파일). JSON 우선.
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:secrets/fcm-service-account.json}
    credentials-json: ${FCM_CREDENTIALS_JSON:}
  admin:
    # /api/v1/admin/* 보호 토큰. 설정하면 X-Admin-Token 헤더 일치를 요구(불일치 401).
    # 빈값(미설정)이면 무인증 개방 — 로컬 개발용. 프로덕션(Railway)은 반드시 ADMIN_TOKEN 설정.
    token: ${ADMIN_TOKEN:}

logging:
  level:
    root: INFO
    com.jobalert: DEBUG
    org.hibernate.SQL: INFO
