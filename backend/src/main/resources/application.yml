spring:
  application:
    name: jobalert-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jobalert:
  saramin:
    # 사람인 거절(2026-06-04)로 휴면. mock 유지.
    mode: ${SARAMIN_MODE:mock}
    api-key: ${SARAMIN_API_KEY:}
    base-url: https://oapi.saramin.co.kr/job-search
    daily-call-limit: 500
  # 하이브리드 수집 소스 (2026-06-04 전환). 각 소스는 JobSource 빈으로 자동 등록됨.
  sources:
    greenhouse:
      enabled: ${GREENHOUSE_ENABLED:true}   # 공개 API, 키 불필요
    lever:
      enabled: ${LEVER_ENABLED:true}        # 공개 API, 키 불필요
    public-institution:
      # 기재부 공공기관 채용 API. data.go.kr serviceKey 필요(JOBALERT_PUBINST_KEY).
      enabled: ${PUBINST_ENABLED:false}
      service-key: ${JOBALERT_PUBINST_KEY:}
      max-pages: 5
      page-size: 100
    seoul:
      # 서울시 일자리포털. data.seoul.go.kr serviceKey(JOBALERT_SEOUL_KEY). sample로 테스트 가능.
      enabled: ${SEOUL_ENABLED:false}
      service-key: ${JOBALERT_SEOUL_KEY:sample}
      max-rows: ${SEOUL_MAX_ROWS:1000}
  collector:
    # Daily 08:00 KST = 23:00 UTC. cron zone=UTC(스케줄러에 명시).
    # 아침 9시 다이제스트(morning=오늘 첫등장)에 그날 수집분이 담기도록 알림 1시간 전에 수집.
    cron: "0 0 23 * * *"
    enabled: ${COLLECTOR_ENABLED:false}
  push:
    morning-cron: "0 0 0 * * *"   # 00:00 UTC = 09:00 KST
    evening-cron: "0 0 12 * * *"  # 12:00 UTC = 21:00 KST
    enabled: ${PUSH_ENABLED:false}
  fcm:
    # FCM 푸시 발송. 활성화: FCM_ENABLED=true
    # 키 제공: 클라우드는 FCM_CREDENTIALS_JSON(서비스계정 JSON 통째), 로컬은 FCM_CREDENTIALS_PATH(파일). JSON 우선.
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:secrets/fcm-service-account.json}
    credentials-json: ${FCM_CREDENTIALS_JSON:}
  admin:
    # /api/v1/admin/* 보호 토큰. 설정하면 X-Admin-Token 헤더 일치를 요구(불일치 401).
    # 빈값(미설정)이면 무인증 개방 — 로컬 개발용. 프로덕션(Railway)은 반드시 ADMIN_TOKEN 설정.
    token: ${ADMIN_TOKEN:}

logging:
  level:
    root: INFO
    com.jobalert: DEBUG
    org.hibernate.SQL: INFO
