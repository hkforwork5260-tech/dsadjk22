services:
  postgres:
    image: postgres:16-alpine
    container_name: jobalert-postgres
    environment:
      POSTGRES_DB: jobalert
      POSTGRES_USER: jobalert
      POSTGRES_PASSWORD: jobalert
    ports:
      - "5432:5432"
    volumes:
      - jobalert-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobalert -d jobalert"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jobalert-redis
    ports:
      - "6379:6379"
    volumes:
      - jobalert-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobalert-postgres-data:
  jobalert-redis-data:
